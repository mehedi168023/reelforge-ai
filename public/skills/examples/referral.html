  <script>
    const tl = gsap.timeline({ paused: true });
    const c = FF.t.local("referral");
    const end = FF.t.dur("referral");

    FF.zoomIn(tl, "#rf-stage", 0);
    FF.slam(tl, "#rf-more", 0, 1.8);
    FF.shake(tl, "#rf-shk", 0.1, 16);
    const main = c("r_friend");
    tl.to("#rf-more", { y: -320, opacity: 0, filter: "blur(12px)", duration: 0.2, ease: "power3.in" }, main - 0.2);

    FF.blurWords(tl, "#rf-head", main, 0.07);
    tl.fromTo("#rf-you", { scale: 0, opacity: 0, svgOrigin: "490 380" }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.4)" }, main + 0.02);
    FF.ring(tl, "#rf-fx", main + 0.06, { x: 580, y: 590, r: 340, color: "#c9a5ff" });

    // One invite goes out along each line; a friend pops on arrival, a coin rides back to you.
    const rays = [["#rf-l1", "#rf-f1", 260, 360], ["#rf-l2", "#rf-f2", 900, 360], ["#rf-l3", "#rf-f3", 260, 820], ["#rf-l4", "#rf-f4", 900, 820]];
    const host = document.getElementById("rf-coins");
    rays.forEach((r, i) => {
      const t0 = main + 0.42 + i * 0.3;
      tl.to(r[0], { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, t0);
      tl.fromTo(r[1], { scale: 0, opacity: 0, svgOrigin: i % 2 ? (i < 2 ? "810 150" : "810 610") : (i < 2 ? "170 150" : "170 610") }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(2.6)" }, t0 + 0.2);
      const coin = document.createElement("div");
      coin.className = "rf-c";
      coin.innerHTML = FF.coinSvg(64);
      host.appendChild(coin);
      tl.fromTo(coin, { x: r[2] - 32, y: r[3] - 32, scale: 0.4, opacity: 0 }, { x: 580 - 32, y: 590 - 32, scale: 1, opacity: 1, duration: 0.46, ease: "power2.inOut" }, t0 + 0.5);
      tl.to(coin, { opacity: 0, scale: 0.3, duration: 0.08 }, t0 + 0.96);
      tl.fromTo("#rf-you", { scale: 1 }, { scale: 1.12, duration: 0.08, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, t0 + 0.94);
    });

    // The range lands number by number.
    const amt = c("r_amount");
    FF.slam(tl, "#rf-a1", amt, 1.8);
    tl.fromTo("#rf-dash", { opacity: 0 }, { opacity: 1, duration: 0.1 }, amt + 0.32);
    FF.slam(tl, "#rf-a2", c("r_amount2"), 2.1);
    FF.shake(tl, "#rf-shk", c("r_amount2") + 0.1, 14);
    FF.burst(tl, "#rf-fx", c("r_amount2") + 0.1, { x: 1560, y: 330, n: 22, kind: "coin", r: 560, seed: 33, fall: 700 });
    FF.riseWords(tl, "#rf-sub", c("r_bonus"), 0.08);
    tl.fromTo("#rf-rule", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, c("r_rule"));

    FF.whipOut(tl, "#rf-stage", -1, end);
    window.__timelines["referral"] = tl;
