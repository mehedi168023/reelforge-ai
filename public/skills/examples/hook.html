  <script>
    const tl = gsap.timeline({ paused: true });
    const c = FF.t.local("hook");
    const end = FF.t.dur("hook");

    ["#hk-co1", "#hk-co2", "#hk-co3"].forEach((s) => (document.querySelector(s).innerHTML = FF.coinSvg(120)));

    // Part 1. The headline is on screen at frame 0 for the thumbnail; the scope hunts for the heart.
    tl.fromTo("#hk-title", { scale: 1.08, transformOrigin: "0% 50%" }, { scale: 1, duration: 0.5, ease: "expo.out" }, 0);
    FF.blurWords(tl, "#hk-kick", 0.05, 0.08);
    tl.fromTo("#hk-scope", { x: 560, y: -220, scale: 1.35, rotation: 40, filter: "blur(14px)" },
      { x: 0, y: 0, scale: 1, rotation: 0, filter: "blur(0px)", duration: 0.62, ease: "expo.out" }, 0);
    tl.to("#hk-ticks", { rotation: 200, svgOrigin: "340 340", duration: c("h_you") + 0.1, ease: "none" }, 0);
    const lock = c("h_lover");
    tl.fromTo("#hk-heartp", { scale: 0.2, opacity: 0, svgOrigin: "340 320" }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.6)" }, lock);
    FF.ring(tl, "#hk-fx", lock, { x: 1460, y: 530, r: 420, color: "#ff5d72" });
    FF.shake(tl, "#hk-shk", lock, 12);
    tl.to("#hk-heartp", { scale: 1.14, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 3, svgOrigin: "340 320" }, lock + 0.55);

    // Part 2. Swap on one stage; the scope collapses into the play button.
    const you = c("h_you");
    FF.out(tl, "#hk-a", you - 0.16);
    tl.to("#hk-scope", { scale: 0.3, opacity: 0, rotation: 90, duration: 0.2, ease: "power3.in" }, you - 0.16);
    gsap.set("#hk-l2", { opacity: 1 });
    FF.pop(tl, "#hk-play", you, { from: 0.25, ease: "back.out(2.4)" });
    FF.ring(tl, "#hk-fx", you + 0.04, { x: 1460, y: 530, r: 400, color: "#49a6ff" });
    tl.fromTo("#hk-tri", { scale: 0.6, svgOrigin: "250 230" }, { scale: 1, duration: 0.4, ease: "back.out(3)" }, you + 0.08);
    FF.blurWords(tl, "#hk-b1", you + 0.02, 0.09);
    tl.fromTo("#hk-hl", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, you + 0.62);
    tl.fromTo("#hk-band", { scaleX: 0 }, { scaleX: 1, duration: 0.34, ease: "expo.out" }, you + 0.7);
    tl.to("#hk-hl", { color: "#1a1200", duration: 0.01 }, you + 0.7);

    // Part 3. The wallet opens, coins try to leave, and "no worries" sends them home.
    const pk = c("h_pocket");
    FF.out(tl, "#hk-b", pk - 0.16);
    tl.to("#hk-play", { x: 320, opacity: 0, filter: "blur(12px)", duration: 0.2, ease: "power3.in" }, pk - 0.16);
    FF.blurWords(tl, "#hk-c1", pk, 0.07);
    tl.fromTo("#hk-wallet", { y: 420, rotation: 14, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "expo.out" }, pk);
    FF.riseWords(tl, "#hk-c2", c("h_money"), 0.08);
    const open = c("h_money");
    tl.fromTo("#hk-flap", { scaleY: 1, svgOrigin: "320 150" }, { scaleY: -0.9, duration: 0.32, ease: "back.out(1.6)" }, open);
    const flights = [["#hk-co1", -210, -250, -30], ["#hk-co2", 10, -340, 20], ["#hk-co3", 225, -235, 40]];
    flights.forEach((f, i) => {
      const t0 = open + 0.12 + i * 0.13;
      tl.fromTo(f[0], { x: 0, y: 40, scale: 0.4, rotation: 0, opacity: 0 }, { x: f[1], y: f[2], scale: 1, rotation: f[3], opacity: 1, duration: 0.52, ease: "power3.out" }, t0);
    });
    const safe = c("h_worry");
    FF.slam(tl, "#hk-c3", safe, 1.7);
    flights.forEach((f, i) => {
      tl.to(f[0], { x: 0, y: 60, scale: 0.4, rotation: 0, opacity: 0, duration: 0.3, ease: "power3.in" }, safe - 0.34 + i * 0.05);
    });
    tl.to("#hk-flap", { scaleY: 1, duration: 0.2, ease: "power4.in" }, safe - 0.12);
    FF.shake(tl, "#hk-shk", safe + 0.06, 18);
    FF.pop(tl, "#hk-safe", safe + 0.06, { from: 2.2, ease: "expo.out", dur: 0.3 });
    tl.to("#hk-safep", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, safe + 0.2);
    FF.ring(tl, "#hk-fx", safe + 0.08, { x: 1645, y: 665, r: 420, color: "#2bd07a" });
    FF.burst(tl, "#hk-fx", safe + 0.08, { x: 1645, y: 665, n: 18, kind: "spark", colors: ["#2bd07a", "#ffffff"], r: 420, seed: 11 });

    window.__timelines["hook"] = tl;
