  <script>
    const tl = gsap.timeline({ paused: true });
    const c = FF.t.local("pc");
    const end = FF.t.dur("pc");

    // The PC is built piece by piece; each part lands with weight.
    tl.fromTo("#pc-rig", { scale: 1.1 }, { scale: 1, duration: 1.4, ease: "expo.out" }, 0);
    tl.to("#pc-desk", { strokeDashoffset: 0, duration: 0.3, ease: "power3.out" }, 0);
    tl.fromTo("#pc-mon", { y: -860 }, { y: 0, duration: 0.42, ease: "bounce.out" }, 0.04);
    FF.shake(tl, "#pc-shk", 0.2, 22);
    tl.fromTo("#pc-tower", { x: 900 }, { x: 0, duration: 0.34, ease: "expo.out" }, 0.3);
    tl.fromTo("#pc-kb", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.48);
    tl.fromTo("#pc-ms", { y: 300, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.6)" }, 0.58);
    FF.blurWords(tl, "#pc-kick", 0.1, 0.07);

    // Power on: RGB sweeps, fans spin up, the screen boots to the logo on "গেমিং পিসি".
    const on = c("p_pc");
    ["#pc-monrgb", "#pc-twrgb", "#pc-kbrgb"].forEach((s, i) => tl.to(s, { opacity: 1, duration: 0.14, ease: "none" }, on + i * 0.05));
    tl.to("#pc-f1", { rotation: 1980, svgOrigin: "960 340", duration: end - on, ease: "power1.in" }, on);
    tl.to("#pc-f2", { rotation: -1980, svgOrigin: "960 520", duration: end - on, ease: "power1.in" }, on);
    tl.fromTo("#pc-logoscreen", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.36, ease: "back.out(2)" }, on + 0.08);
    FF.ring(tl, "#pc-fx", on + 0.1, { x: 580, y: 500, r: 520, color: "#49a6ff" });
    FF.slam(tl, "#pc-title", on, 1.7);
    FF.shake(tl, "#pc-shk", on + 0.16, 16);
    tl.fromTo("#pc-spot1", { rotation: -30, opacity: 0 }, { rotation: 18, opacity: 1, duration: 1.2, ease: "power2.inOut" }, on);
    tl.fromTo("#pc-spot2", { rotation: 30, opacity: 0 }, { rotation: -14, opacity: 1, duration: 1.2, ease: "power2.inOut" }, on);
    tl.to("#pc-spot1", { rotation: -8, duration: 2.6, ease: "sine.inOut" }, on + 1.2);
    tl.to("#pc-spot2", { rotation: 12, duration: 2.6, ease: "sine.inOut" }, on + 1.2);

    // "হ্যাঁ, ঠিকই শুনেছেন!": the bubble answers the viewer's disbelief, then the rule, then the chance.
    const yes = c("p_yes");

    tl.fromTo("#pc-yes", { opacity: 0, scale: 0.3, transformOrigin: "0% 100%" }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.4)" }, yes);
    const rule = c("p_rule");
    tl.fromTo("#pc-rule", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, rule);
    tl.to("#pc-rulec", { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, rule + 0.2);
    const win = c("p_win");
    FF.riseWords(tl, "#pc-win", win, 0.09);
    FF.burst(tl, "#pc-fx", c("p_chance"), { x: 580, y: 120, n: 60, kind: "confetti", r: 900, seed: 27, fall: 820 });
    FF.burst(tl, "#pc-fx", c("p_chance") + 0.12, { x: 1500, y: 300, n: 40, kind: "confetti", r: 700, seed: 28, fall: 820 });

    FF.whipOut(tl, "#pc-stage", 1, end);
