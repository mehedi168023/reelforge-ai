  <script>
    const tl = gsap.timeline({ paused: true });
    const c = FF.t.local("endcard");
    const end = FF.t.dur("endcard");
    document.getElementById("ec-rays").innerHTML = FF.raysSvg(1600, 20, "#49a6ff");

    FF.zoomIn(tl, "#ec-stage", 0);
    tl.fromTo("#ec-logo", { opacity: 0, scale: 2.2, rotation: -7, filter: "blur(16px)" },

    FF.ring(tl, "#ec-fx", 0.2, { x: 960, y: 300, r: 720, color: "#49a6ff", w: 12 });
    tl.fromTo("#ec-rays", { opacity: 0 }, { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 0.1);
    tl.to("#ec-rays", { rotation: 22, duration: end, ease: "none" }, 0.1);

    FF.split("#ec-tag");
    const words = gsap.utils.toArray("#ec-tag .w");
    tl.fromTo(words.slice(0, 3), { opacity: 0, filter: "blur(10px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.2, stagger: 0.09, ease: "power2.out" }, c("e_tag1"));

    // The address types itself, then the bar lands the last word of the film.
    const go = c("e_visit");
    FF.blurWords(tl, "#ec-go", go, 0.08);
    tl.fromTo("#ec-bar", { y: 240, scale: 0.6, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.42, ease: "back.out(1.5)" }, go);
    const letters = gsap.utils.toArray("#ec-url span");
    const ty = c("e_url");
    tl.fromTo(letters, { opacity: 0 }, { opacity: 1, duration: 0.01, stagger: 0.055, ease: "none" }, ty);
    const done = ty + letters.length * 0.055;
    tl.to("#ec-caret", { opacity: 0, duration: 0.01 }, done + 0.1);
    FF.ring(tl, "#ec-fx", done + 0.08, { x: 960, y: 895, r: 640, color: "#ffd65a", w: 10 });
    FF.burst(tl, "#ec-fx", done + 0.08, { x: 960, y: 895, n: 26, kind: "spark", colors: ["#ffd65a", "#9fd0ff", "#fff"], r: 620, seed: 43 });

    window.__timelines["endcard"] = tl;
