          </svg>

        <div class="layer" id="au-l2">

            <path id="au-w3" stroke="#49a6ff" d="M780 680 C740 720 760 850 712 850" pathLength="100" stroke-dasharray="100 120" stroke-dashoffset="110"/>

          <div class="t t-md green" id="au-sys">অটোমেটিক সিস্টেম</div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const c = FF.t.local("auto");
    const end = FF.t.dur("auto");

    // Teeth are generated so the two gears really mesh.
    const svgNS = "http://www.w3.org/2000/svg";
    function teeth(id, cx, cy, n, inner, tw, th, fill) {
      const g = document.getElementById(id);
      if (g.childNodes.length) return;
      for (let i = 0; i < n; i++) {
        const r = document.createElementNS(svgNS, "rect");
        r.setAttribute("x", cx - tw / 2);
        r.setAttribute("y", cy - inner - th);
        r.setAttribute("width", tw);
        r.setAttribute("height", th + 8);
        r.setAttribute("rx", 7);
        r.setAttribute("fill", fill);
        r.setAttribute("transform", "rotate(" + (i * 360) / n + " " + cx + " " + cy + ")");
        g.appendChild(r);
      }
    }
    teeth("au-g1t", 190, 250, 14, 140, 34, 34, "#1e86ff");
    teeth("au-g2t", 392, 128, 9, 82, 28, 28, "#ffc21e");

    // Feature lead-in: the star spins in, then the camera dives through it.
    FF.zoomIn(tl, "#au-stage", 0);
    tl.fromTo("#au-star", { rotation: -300, scale: 0, opacity: 0 }, { rotation: 0, scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.5)" }, 0);
    FF.blurWords(tl, "#au-feat", 0.1, 0.09);
    FF.ring(tl, "#au-fx", 0.5, { x: 960, y: 370, r: 460, color: "#ffd65a" });
    FF.burst(tl, "#au-fx", 0.5, { x: 960, y: 370, n: 22, kind: "spark", colors: ["#ffd65a", "#fff"], r: 560, seed: 19 });
    const a = c("a_auto");
    tl.to("#au-star", { scale: 5, rotation: 90, opacity: 0, duration: 0.22, ease: "power3.in" }, a - 0.22);
    FF.out(tl, "#au-feat", a - 0.2);

    // Title slams, the machine starts turning.
    FF.slam(tl, "#au-title", a, 1.5);
    FF.shake(tl, "#au-shk", a + 0.14, 16);
    tl.fromTo("#au-gears", { scale: 0, rotation: -120, opacity: 0 }, { scale: 1.55, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, a + 0.08);
    tl.to("#au-gears", { scale: 1, duration: 0.5, ease: "power2.inOut" }, c("a_room") - 0.46);
    const run = end - a;
    // Same pitch speed at the mesh: angle ratio is the inverse of the tooth ratio.
    tl.to("#au-g1", { rotation: 360 * 2.25, svgOrigin: "190 250", duration: run, ease: "none" }, a);
    tl.to("#au-g2", { rotation: (-360 * 2.25 * 14) / 9, svgOrigin: "392 128", duration: run, ease: "none" }, a);

    // Each panel wakes and runs itself when the voice names it.
    function wake(panel, wire, t) {
      tl.fromTo(panel, { opacity: 0, scale: 0.72, rotationY: panel.endsWith("1") || panel.endsWith("3") ? 34 : -34, transformPerspective: 1300 },
        { opacity: 1, scale: 1, rotationY: 0, duration: 0.45, ease: "expo.out" }, t);
      tl.to(wire, { strokeDashoffset: 0, duration: 0.22, ease: "power2.out" }, t - 0.1);
    }
    const rm = c("a_room");
    wake("#au-p1", "#au-w1", rm);
    tl.fromTo("#au-p1 .au-val b", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.08, stagger: 0.09, ease: "none" }, rm + 0.14);
    const pw = c("a_pass");
    wake("#au-p2", "#au-w2", pw);
    tl.fromTo("#au-p2 .au-val i", { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.1, stagger: 0.08, ease: "back.out(3)" }, pw + 0.14);
    const mg = c("a_mgmt");
    wake("#au-p3", "#au-w3", mg);
    tl.fromTo("#au-progf", { scaleX: 0 }, { scaleX: 1, duration: 1, ease: "power2.inOut" }, mg + 0.14);
    const rs = c("a_result");
    wake("#au-p4", "#au-w4", rs);
    tl.fromTo("#au-p4 .bar", { scaleY: 0 }, { scaleY: 1, duration: 0.42, stagger: 0.1, ease: "back.out(1.8)" }, rs + 0.14);
    FF.burst(tl, "#au-fx", rs + 0.5, { x: 1520, y: 860, n: 16, kind: "spark", colors: ["#ffd65a", "#fff"], r: 300, seed: 23 });

    // "অটোমেটিক সিস্টেমের মাধ্যমে": every panel is ticked off, green, one after another.
    const sys = c("a_sys");
    FF.riseWords(tl, "#au-sys", sys, 0.1);
    ["#au-p1", "#au-p2", "#au-p3", "#au-p4"].forEach((p, i) => {
      const panel = document.querySelector(p);
      const ok = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      ok.setAttribute("viewBox", "0 0 72 72");
      ok.setAttribute("class", "au-ok");
      ok.innerHTML = '<circle cx="36" cy="36" r="34" fill="#2bd07a"/><path d="M19 37 L31 49 L54 23" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>';
      panel.appendChild(ok);
      tl.fromTo(ok, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "back.out(3)" }, sys + 0.2 + i * 0.22);
      tl.to(p, { borderColor: "#2bd07a", duration: 0.2, ease: "none" }, sys + 0.2 + i * 0.22);
      ["#au-w1", "#au-w2", "#au-w3", "#au-w4"].forEach((w, j) => { if (j === i) tl.to(w, { stroke: "#2bd07a", duration: 0.2, ease: "none" }, sys + 0.2 + i * 0.22); });
    });
    FF.whipOut(tl, "#au-stage", 1, end);
    window.__timelines["auto"] = tl;
  </script>
