<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- A film page runs here with no origin and no network, so it can't reach the API keys or send anything anywhere. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; media-src data:">
<script>
  addEventListener('message', function boot(e) {
    if (e.source !== parent || !e.data || e.data.type !== 'load') return;
    removeEventListener('message', boot);
    document.open();
    document.write(e.data.html);
    document.close();
  });
  parent.postMessage({ type: 'frame-ready' }, '*');
</script>
</head>
<body></body>
</html>
